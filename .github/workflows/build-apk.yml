name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk block-claim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: block-claim-apk
          path: block-claim.apk

      # A release makes the APK easy to download on a phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/block-claim.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Block Claim build ${{ github.run_number }}
          body: Install block-claim.apk on your Android phone. Each new build installs over the previous one.
          files: block-claim.apk
          make_latest: true
