name: Check server image

# Builds the Docker image and plays a short game against it, so a broken server
# never reaches your NAS.
on:
  push:
    branches: [main]
    paths: ['server/**', 'docker-compose.yml', 'app/src/main/assets/index.html', '.github/workflows/server-image.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done

      - name: Smoke test
        run: |
          set -e
          B=http://127.0.0.1:8787
          curl -sf $B/ | grep -q "Block"
          CREATE=$(curl -sf -X POST $B/api/games -H 'Content-Type: application/json' -d '{"state":"{\"S\":{\"n1\":\"A\"},\"turn\":1}"}')
          CODE=$(echo "$CREATE" | python3 -c 'import json,sys;print(json.load(sys.stdin)["code"])')
          curl -sf -X POST $B/api/games/$CODE/join -H 'Content-Type: application/json' -d '{"name":"B"}' | grep -q '"seat":2'
          curl -sf "$B/api/games/$CODE?since=-1" | grep -q '"status":"playing"'
          docker compose restart && sleep 3
          curl -sf "$B/api/games/$CODE?since=-1" | grep -q '"rev":2'
          echo "Server image OK; games survive a restart."

      - name: Logs
        if: always()
        run: docker compose logs
